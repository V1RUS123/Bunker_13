<!DOCTYPE html>
<html>
<head>
    <title>Bunker 13 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui { position: absolute; top: 10px; left: 10px; color: #0f0; font-family: monospace; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>BUNKER 13: 3D TEST</h1>
        <p>Resources: Loading...</p>
    </div>
    <!-- Подключаем библиотеку для 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Создаем сцену
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Создаем "Бункер" (пока это просто коробка)
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const bunker = new THREE.Mesh(geometry, material);
        scene.add(bunker);

        camera.position.z = 5;

        // Анимация вращения
        function animate() {
            requestAnimationFrame(animate);
            bunker.rotation.x += 0.01;
            bunker.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // Подгонка под размер экрана
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
